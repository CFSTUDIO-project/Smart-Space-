<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><defs><linearGradient id="gold"><stop stop-color="#F3D77B"/><stop offset="1" stop-color="#B77F27"/></linearGradient></defs><rect width="760" height="1040" rx="38" fill="#0B0D10"/><rect x="24" y="24" width="712" height="992" rx="28" fill="#101318" stroke="#37342B"/><g font-family="Arial,sans-serif"><rect x="66" y="64" width="56" height="56" rx="16" fill="#1F2229" stroke="#66542E"/><path d="M78 82h24c10 0 10 16 0 16H88c-10 0-10 16 0 16h20" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/><text x="142" y="91" fill="#F3F1EA" font-size="19" font-weight="700" letter-spacing="2">SMART SPACE</text><text x="142" y="113" fill="#D9B24F" font-size="10" font-weight="700" letter-spacing="2">FIRST-RUN AUTHORIZATION</text><text x="66" y="185" fill="#F5F1E8" font-size="37" font-weight="700">Prepare your device.</text><text x="66" y="219" fill="#999FAA" font-size="15">Each permission opens a real Android Settings or runtime prompt.</text><g transform="translate(66 262)"><rect width="628" height="116" rx="17" fill="#1D2027" stroke="#4D442F"/><text x="22" y="32" fill="#D9B24F" font-size="11" font-weight="700">01</text><text x="65" y="34" fill="#F4F1E8" font-size="17" font-weight="700">Display over other apps</text><text x="65" y="62" fill="#9DA3AD" font-size="12">Required for the edge trigger and floating panel.</text><rect x="65" y="78" width="148" height="26" rx="8" fill="url(#gold)"/><text x="139" y="96" fill="#211C12" font-size="10" font-weight="700" text-anchor="middle">AUTHORIZE</text></g><g transform="translate(66 394)"><rect width="628" height="116" rx="17" fill="#1D2027" stroke="#343842"/><text x="22" y="32" fill="#D9B24F" font-size="11" font-weight="700">02</text><text x="65" y="34" fill="#F4F1E8" font-size="17" font-weight="700">Notifications</text><text x="65" y="62" fill="#9DA3AD" font-size="12">Service status and persistent overlay notification.</text><rect x="65" y="78" width="148" height="26" rx="8" fill="#343842"/><text x="139" y="96" fill="#F4F1E8" font-size="10" font-weight="700" text-anchor="middle">ALLOW</text></g><g transform="translate(66 526)"><rect width="628" height="116" rx="17" fill="#1D2027" stroke="#343842"/><text x="22" y="32" fill="#D9B24F" font-size="11" font-weight="700">03</text><text x="65" y="34" fill="#F4F1E8" font-size="17" font-weight="700">Camera / flashlight</text><text x="65" y="62" fill="#9DA3AD" font-size="12">Used only for the device's physical flash unit.</text><rect x="65" y="78" width="148" height="26" rx="8" fill="#343842"/><text x="139" y="96" fill="#F4F1E8" font-size="10" font-weight="700" text-anchor="middle">ALLOW</text></g><g transform="translate(66 658)"><rect width="628" height="116" rx="17" fill="#1D2027" stroke="#343842"/><text x="22" y="32" fill="#D9B24F" font-size="11" font-weight="700">04</text><text x="65" y="34" fill="#F4F1E8" font-size="17" font-weight="700">Background / battery settings</text><text x="65" y="62" fill="#9DA3AD" font-size="12">Review device-specific restrictions; optional and user-controlled.</text><rect x="65" y="78" width="148" height="26" rx="8" fill="#343842"/><text x="139" y="96" fill="#F4F1E8" font-size="10" font-weight="700" text-anchor="middle">REVIEW</text></g><rect x="66" y="822" width="628" height="64" rx="14" fill="url(#gold)"/><text x="380" y="861" fill="#211C12" text-anchor="middle" font-size="15" font-weight="700">NEXT  →</text><text x="66" y="936" fill="#8E949E" font-size="12">Illustrative setup layout. The app checks every permission directly.</text><text x="66" y="963" fill="#D9B24F" font-size="10" font-weight="700" letter-spacing="2">USER AUTHORIZATION · NO SILENT PRIVILEGE ESCALATION</text></g></svg>